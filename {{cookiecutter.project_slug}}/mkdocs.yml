site_name: {{cookiecutter.project_name}}
repo_name: {{cookiecutter.author}}/{{cookiecutter.project_slug}}

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
  - mkdocs-jupyter:
      include: ["**/*.ipynb"]
      ignore_h1: false

nav:
  - Home: index.md
